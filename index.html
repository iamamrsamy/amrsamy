<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amr Samy | Magician</title>

    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Magical Background -->
    <div class="magic-bg"></div>

    <!-- Stars -->
    <div class="stars"></div>

    <!-- Floating particles -->
    <div id="particles"></div>

    <!-- Main Scene -->
    <main class="scene">

        <!-- Magical Card -->
        <div class="magic-card" id="magicCard">

            <!-- Golden Border -->
            <div class="gold-frame"></div>

            <!-- Top Symbol -->
            <div class="top-symbol">
                <span>A</span>
                <small>♠</small>
            </div>

            <!-- Decorative corner -->
            <div class="corner corner-tl">✦</div>
            <div class="corner corner-tr">✦</div>
            <div class="corner corner-bl">✦</div>
            <div class="corner corner-br">✦</div>

            <!-- Main Logo -->
            <div class="logo-container">

                <!-- Put your logo here -->
                <img src="logo.png"
                     alt="Amr Samy Magic Logo"
                     class="logo">

                <div class="magic-ring"></div>
                <div class="magic-ring ring-two"></div>

            </div>

            <!-- Name -->
            <div class="name-area">

                <div class="small-title">
                    THE ART OF
                </div>

                <h1>AMR SAMY</h1>

                <div class="title-line">
                    <span></span>
                    <b>MAGICIAN</b>
                    <span></span>
                </div>

            </div>

            <!-- Description -->
            <p class="intro">
                Creating moments that feel impossible.
            </p>

            <!-- Magical Divider -->
            <div class="divider">
                <span>✦</span>
                <i></i>
                <span>♠</span>
                <i></i>
                <span>✦</span>
            </div>

            <!-- Contact -->
            <div class="contact-area">

                <a href="tel:01115552621" class="contact-item">

                    <div class="icon">
                        <i class="fa-solid fa-phone"></i>
                    </div>

                    <div>
                        <small>CALL THE MAGICIAN</small>
                        <strong>01115552621</strong>
                    </div>

                </a>

            </div>

            <!-- Social -->
            <div class="social-area">

                <p>FOLLOW THE MAGIC</p>

                <div class="socials">

                    <a href="https://instagram.com/iamamrsamy"
                       target="_blank">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="https://facebook.com/iamamrsamy"
                       target="_blank">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="https://www.tiktok.com/@iamamrsamy"
                       target="_blank">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>

                    <a href="https://youtube.com/@iamamrsamy"
                       target="_blank">
                        <i class="fa-brands fa-youtube"></i>
                    </a>

                </div>

                <div class="username">
                    @iamamrsamy
                </div>

            </div>

            <!-- Enter Button -->
            <button class="magic-button" id="magicButton">

                <span>ENTER THE MAGIC</span>

                <i class="fa-solid fa-wand-magic-sparkles"></i>

            </button>

            <!-- Bottom Playing Card -->
            <div class="bottom-card-symbol">
                <span>♠</span>
                <b>A</b>
            </div>

        </div>

        <!-- Bottom Text -->
        <div class="scene-footer">
            <span>AMR SAMY MAGIC</span>
            <i></i>
            <span>EST. MAGIC</span>
        </div>

    </main>


    <!-- Magic Flash -->
    <div class="magic-flash" id="magicFlash"></div>


    <script src="script.js"></script>

</body>
</html>
