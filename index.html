<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amr Samy | Magician</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Main Card -->
    <main class="business-card">

        <!-- Decorative Top -->
        <div class="ornament top-ornament">
            ❧
        </div>

        <!-- Playing Card Symbol -->
        <div class="card-symbol">
            A
            <span>♠</span>
        </div>

        <!-- Logo -->
        <div class="logo-area">

            <!-- Replace logo.png with your actual logo -->
            <img src="logo.png" alt="Amr Samy Magic Logo">

        </div>

        <!-- Name -->
        <section class="identity">

            <h1>AMR SAMY</h1>

            <div class="title">
                <span></span>
                MAGICIAN
                <span></span>
            </div>

        </section>

        <!-- Short Description -->
        <p class="description">
            Creating unforgettable moments through the art of magic.
        </p>

        <!-- Phone -->
        <a href="tel:01115552621" class="phone">

            <i class="fa-solid fa-phone"></i>

            <span>01115552621</span>

        </a>

        <!-- Social Media -->
        <div class="social-section">

            <div class="social-icons">

                <a href="https://instagram.com/iamamrsamy"
                   target="_blank"
                   aria-label="Instagram">

                    <i class="fa-brands fa-instagram"></i>

                </a>

                <a href="https://facebook.com/iamamrsamy"
                   target="_blank"
                   aria-label="Facebook">

                    <i class="fa-brands fa-facebook-f"></i>

                </a>

                <a href="https://www.tiktok.com/@iamamrsamy"
                   target="_blank"
                   aria-label="TikTok">

                    <i class="fa-brands fa-tiktok"></i>

                </a>

                <a href="https://youtube.com/@iamamrsamy"
                   target="_blank"
                   aria-label="YouTube">

                    <i class="fa-brands fa-youtube"></i>

                </a>

            </div>

            <div class="username">
                @iamamrsamy
            </div>

        </div>

        <!-- Buttons -->
        <div class="buttons">

            <a href="tel:01115552621" class="main-button">
                <i class="fa-solid fa-phone"></i>
                Contact Me
            </a>

            <button onclick="saveContact()" class="secondary-button">
                <i class="fa-solid fa-address-card"></i>
                Save Contact
            </button>

        </div>

        <!-- Bottom Card Symbol -->
        <div class="bottom-symbol">
            <span>♥</span>
            <strong>A</strong>
        </div>

        <!-- Decorative Bottom -->
        <div class="ornament bottom-ornament">
            ❧
        </div>

    </main>

    <!-- JS -->
    <script src="script.js"></script>

</body>
</html>
