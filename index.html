<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amr Samy | The Magician</title>
  <meta name="description" content="Amr Samy - Magician & Entertainer">
  <meta name="theme-color" content="#050505">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- MAGIC BACKGROUND -->
  <canvas id="magicCanvas"></canvas>
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>
  <!-- FLOATING CARDS -->
  <div class="floating-card card-a">♠</div>
  <div class="floating-card card-b">♥</div>
  <div class="floating-card card-c">♣</div>
  <div class="floating-card card-d">♦</div>
  <!-- TOP BRAND -->
  <header class="topbar">
    <div class="brand-mark">AS</div>
    <div class="brand-text">
      <strong>AMR SAMY</strong>
      <span>THE MAGICIAN</span>
    </div>
    <button class="sound-btn" id="soundBtn" aria-label="Sound">
      ♫
    </button>
  </header>
  <!-- MAIN MAGIC CARD -->
  <main>
    <div class="magic-stage">
      <!-- MAGIC WAND -->
      <div class="wand">
        <span></span>
      </div>
      <!-- CARD -->
      <div class="magic-card" id="magicCard">
        <!-- FRONT -->
        <div class="card-face card-front">
          <div class="card-corner top-left">
            <strong>A</strong>
            <span>♠</span>
          </div>
          <div class="card-corner bottom-right">
            <strong>A</strong>
            <span>♠</span>
          </div>
          <div class="card-border"></div>
          <div class="card-center">
            <div class="reveal-symbol">
              <span>AS</span>
              <small>MAGIC</small>
            </div>
            <div class="front-name">
              AMR SAMY
            </div>
            <div class="front-title">
              THE MAGICIAN
            </div>
            <div class="tap-hint">
              <span>✦</span>
              TAP TO REVEAL
              <span>✦</span>
            </div>
          </div>
        </div>
        <!-- BACK -->
        <div class="card-face card-back">
          <div class="card-border"></div>
          <div class="back-content">
            <div class="mini-symbol">
              ♠ ♥ ♣ ♦
            </div>
            <h1>AMR SAMY</h1>
            <p class="profession">
              THE MAGICIAN
            </p>
            <div class="gold-line"></div>
            <p class="tagline">
              Making the impossible<br>
              feel real.
            </p>
            <!-- CONTACT BUTTONS -->
            <div class="contact-actions">
              <a href="tel:+201115552621" class="action">
                <div class="action-icon">☎</div>
                <span>CALL</span>
              </a>
              <a href="https://wa.me/201115552621"
                 target="_blank"
                 class="action whatsapp">
                <div class="action-icon">◉</div>
                <span>WHATSAPP</span>
              </a>
              <a href="mailto:amrsamydxb@gmail.com" class="action">
                <div class="action-icon">✉</div>
                <span>EMAIL</span>
              </a>
              <a href="https://instagram.com/iamamrsamy"
                 target="_blank"
                 class="action">
                <div class="action-icon">◎</div>
                <span>INSTAGRAM</span>
              </a>
            </div>
            <!-- SOCIAL USERNAME -->
            <div class="social-handle">
              @iamamrsamy
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- MAGIC CONTROLS -->
    <div class="controls">
      <button id="revealBtn" class="magic-btn">
        <span>🪄</span>
        REVEAL MAGIC
      </button>
      <button id="shareBtn" class="small-btn">
        ↗ SHARE
      </button>
      <button id="saveBtn" class="small-btn">
        ♡ SAVE CONTACT
      </button>
    </div>
    <!-- QR -->
    <div class="qr-area">
      <button id="qrBtn" class="qr-trigger">
        <span>▦</span>
        SHOW QR CODE
      </button>
      <div class="qr-box" id="qrBox">
        <div id="qrcode"></div>
        <span>
          SCAN TO ENTER THE MAGIC
        </span>
      </div>
    </div>
  </main>
  <!-- FOOTER -->
  <footer>
    <span>© 2026 AMR SAMY</span>
    <span>THE MAGIC NEVER ENDS ✦</span>
  </footer>
  <!-- QR LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
